<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스마일치과 — 치과 상담 준비 · 구강 스캔 (데모)</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="appbar">
  <div class="brand">
    <span class="logo">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2 5.2L19 9l-5 1.8L12 16l-2-5.2L5 9l5-1.8z"/><circle cx="18.5" cy="16.5" r="1.8"/><circle cx="6" cy="17.5" r="1.3"/></svg>
    </span>
    <span id="brandTitle">스마일치과</span>
  </div>
  <button class="bell-btn" id="bellBtn" aria-label="알림" style="display:none;">🔔<span class="bell-count" id="bellCount"></span></button>
  <button class="role-chip" id="roleChip">역할 선택</button>
  <div class="appbar-r"><button class="ab-guide" id="scanGuideTop" data-goto="scannerInfo" style="display:none;">📖 스캐너 학습 가이드</button><span class="demo-ribbon">DEMO · 가상 데이터</span><span class="api-dot" id="apiDot" title="목서버 미연결 — 단일 파일 모드"></span><div class="mode-switch" id="modeSwitch" aria-label="화면 모드"><button class="mode-btn" id="modeLight" aria-pressed="true">☀<span>라이트</span></button><button class="mode-btn" id="modeDark" aria-pressed="false">🌙<span>다크</span></button></div><button class="bell-btn" id="setBtn" aria-label="개인화 설정" style="display:none;">⚙</button><button class="bell-btn" id="helpBtn" aria-label="사용 가이드" style="display:none;"><b style="font-size:13.5px;">?</b></button></div>
</header>

<nav class="crumbs" id="crumbs"></nav>

<main id="root"></main>

<nav class="pfoot" id="pfoot"><button data-pf="home"><i>🏠</i>홈</button><button data-pf="today"><i>📅</i>오늘</button><button data-pf="routine"><i>✅</i>루틴</button><button data-pf="journey"><i>📈</i>여정</button><button data-pf="profile"><i>🙂</i>프로필</button></nav>

<div class="overlay" id="sheetOverlay"><div class="sheet" id="sheetBody"></div></div>
<div class="overlay center" id="modalOverlay"><div class="sheet" id="modalBody"></div></div>
<div class="processing" id="processing"></div>
<div class="toast" id="toast"></div>

<script src="js/assets.js"></script>
<script src="js/dental3d.js"></script>
<script src="js/data.js"></script>
<script src="js/formats.js"></script>
<script src="js/engine.js"></script>
<script src="js/analysis.js"></script>
<script src="js/i18n.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
<script src="js/casehub.js"></script>
<script src="js/api.js"></script>
</body>
</html>
